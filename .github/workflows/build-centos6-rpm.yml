name: Build CoovaChilli 1.8 RPM (CentOS 6)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare source tarball
        run: |
          mkdir -p ${{ github.workspace }}/rpmbuild/SOURCES
          wget --tries=3 -O ${{ github.workspace }}/rpmbuild/SOURCES/coova-chilli-1.8.tar.gz https://codeload.github.com/coova/coova-chilli/tar.gz/refs/tags/1.8

      - name: Fix source tarball ownership
        run: |
          sudo chown $(id -u):$(id -g) ${{ github.workspace }}/rpmbuild/SOURCES/coova-chilli-1.8.tar.gz

      - name: Build RPM in Docker (CentOS 6)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e HOME=/workspace \
            -w /workspace \
            quay.io/centos/centos:6 \
            bash -c "
              set -euo pipefail
              yum clean all
              sed -i 's|^mirrorlist=|#mirrorlist=|g' /etc/yum.repos.d/CentOS-*.repo
              sed -i 's|^#baseurl=http://mirror.centos.org/centos/\$releasever|baseurl=http://vault.centos.org/6.10|g' /etc/yum.repos.d/CentOS-*.repo
              yum -y install epel-release || true
              yum -y install \
                git \
                rpm-build \
                rpmdevtools \
                yum-utils \
                which \
                ca-certificates
              chmod +x /workspace/scripts/build-centos6-rpm.sh
              /workspace/scripts/build-centos6-rpm.sh
            "

      - name: Collect RPM artifacts
        run: |
          mkdir -p artifacts
          find ${{ github.workspace }}/rpmbuild -type f \( -name '*.rpm' -o -name '*.src.rpm' \) -exec cp -v {} artifacts/ \;

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coova-chilli-centos6-rpms
          path: artifacts/*
          if-no-files-found: error
